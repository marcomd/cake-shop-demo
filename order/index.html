<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Order · Crumbcloud</title>
    <meta name="description" content="Crumbcloud bakes handmade celebration cakes to order. Fictitious business for a demo." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CRUMB0DEMO"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-CRUMB0DEMO');
    </script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/order.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/">Crumbcloud</a>
        <nav class="nav" aria-label="Main">
          <a href="/">Cakes</a>
          <a href="/order/">Order</a>
          <a href="/where/">Visit us</a>
          <a href="/contact/">Contact</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <h1>Order a cake</h1>
      <p>Choose a cake and a pickup day. Payment is taken online when you order.</p>

      <form id="order-form">
        <label>Cake
          <select name="cake">
            <option value="cloud-sponge">Cloud sponge · €28</option>
            <option value="pistachio-dream">Pistachio dream · €34</option>
            <option value="lemon-meringue">Lemon meringue · €31</option>
          </select>
        </label>
        <label>Quantity <input name="quantity" type="number" min="1" max="10" value="1" /></label>
        <label>Pickup day <input name="pickup" type="date" required /></label>
        <label>Name <input name="name" autocomplete="name" required /></label>
        <label>Email <input name="email" type="email" autocomplete="email" required /></label>
        <div>
          <p><strong>Card details</strong></p>
          <div id="card-element"></div>
        </div>
        <p class="total">Total: <span id="order-total">€28</span></p>
        <button class="button" type="submit">Pay and order</button>
        <p id="order-status" class="status" role="status"></p>
      </form>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <span>© <span data-year>2026</span> Crumbcloud · A fictitious bakery created for a demo.</span>
        <a href="https://www.youtube.com/results?search_query=cake+decorating" target="_blank" rel="noopener">Cake videos on YouTube</a>
      </div>
    </footer>
  </body>
</html>
