<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Contact · Crumbcloud</title>
    <meta name="description" content="Crumbcloud bakes handmade celebration cakes to order. Fictitious business for a demo." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CRUMB0DEMO"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-CRUMB0DEMO');
    </script>
    <script type="module" src="/src/main.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script type="module" src="/src/contact.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/">Crumbcloud</a>
        <nav class="nav" aria-label="Main">
          <a href="/">Cakes</a>
          <a href="/order/">Order</a>
          <a href="/where/">Visit us</a>
          <a href="/contact/">Contact</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <h1>Contact us</h1>
      <p>Questions about allergens, custom cakes or large orders? Write to us and we will reply within one working day.</p>

      <form id="contact-form">
        <label>Name <input name="name" autocomplete="name" required /></label>
        <label>Email <input name="email" type="email" autocomplete="email" required /></label>
        <label>Message <textarea name="message" rows="5" required></textarea></label>
        <!-- Google's public reCAPTCHA v2 test key: always passes, shows a "testing only" notice. -->
        <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
        <button class="button" type="submit">Send message</button>
        <p id="contact-status" class="status" role="status"></p>
      </form>

      <p class="section">
        Coming by? <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Syntagma+Square,+Athens" target="_blank" rel="noopener">Get directions</a>
      </p>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <span>© <span data-year>2026</span> Crumbcloud · A fictitious bakery created for a demo.</span>
        <a href="https://www.youtube.com/results?search_query=cake+decorating" target="_blank" rel="noopener">Cake videos on YouTube</a>
      </div>
    </footer>
  </body>
</html>
